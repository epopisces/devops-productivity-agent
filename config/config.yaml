# Multi-Agent Workflow Configuration

# Logging configuration
# Levels: DEBUG, INFO, WARNING, ERROR, CRITICAL
logging:
  level: "INFO"  # Set to DEBUG to see agent handoffs and tool calls
  file: null     # Optional: path to log file (e.g., "logs/workflow.log")

# =============================================================================
# Model Providers — define interfaces and available models
# =============================================================================
models:
  # Which provider to use by default
  default_provider: "ollama"

  providers:
    # Ollama — local inference
    ollama:
      host: "http://localhost:11434"
      default_model: "llama3.1:8b"
      models:
        - id: "llama3.1:8b"
          description: "Good tool calling, ~6GB RAM"
        - id: "llama3.2:3b"
          description: "Lightweight, good balance, ~2GB RAM"
        - id: "qwen3:4b"
          description: "Excellent tool calling, ~4GB RAM"

    # OpenAI — cloud API  (uncomment to enable)
    # openai:
    #   api_key: null  # or set OPENAI_API_KEY env var
    #   default_model: "gpt-4o-mini"
    #   models:
    #     - id: "gpt-4o"
    #       description: "Best quality"
    #     - id: "gpt-4o-mini"
    #       description: "Fast and cheap"

    # Azure OpenAI — enterprise cloud  (uncomment to enable)
    # azure_openai:
    #   endpoint: null  # or set AZURE_OPENAI_ENDPOINT env var
    #   default_model: null  # deployment name
    #   models:
    #     - id: "gpt-4o"
    #       description: "Azure-hosted GPT-4o"

agents:
  triage:
    name: "Triage"
    description: "Classifies user intent and extracts domain/tags"
    instructions_file: "config/instructions/triage.md"

  question_handler:
    name: "QuestionHandler"
    description: "Answers questions using knowledge context and retrieval tools"
    instructions_file: "config/instructions/question_handler.md"

  ingestion_preview:
    name: "IngestionPreview"
    description: "Proposes knowledge-base writes for user approval"
    instructions_file: "config/instructions/ingestion_preview.md"

scraper:
  # Request timeout in seconds (10s is sufficient for most sites)
  timeout: 10
  # User agent for web requests
  user_agent: "MultiAgentWorkflow/0.1 (Educational/Personal Use)"
  # Maximum content length to process (in characters)
  max_content_length: 50000

# =============================================================================
# Knowledge Domains — each domain has its own store
# =============================================================================
# Knowledge data lives OUTSIDE the app repo by default (../knowledge/)
# so code and data can be versioned independently.
knowledge:
  # Confidence threshold for human review (0.0 - 1.0)
  confidence_threshold: 0.7
  # Relevance threshold for human review (0.0 - 1.0)
  relevance_threshold: 0.6

  # Define your knowledge domains here.
  # Each domain gets its own notes directory, context file, URL index, and template.
  # Example domains: general, social, technology, entertainment.  Feel free to customize!
  domains:
    general:
      description: "General notes and documentation"
      notes_directory: "../knowledge/general/notes"
      context_file: "../knowledge/general/context.md"
      url_index_file: "../knowledge/general/url_index.yaml"
      template: "../knowledge/general/note_template.md"
      frontmatter_defaults:
        category: "general"
        priority: "medium"
        reviewed: false

    social:
      description: "Social and people-related knowledge"
      notes_directory: "../knowledge/social/notes"
      context_file: "../knowledge/social/context.md"
      url_index_file: "../knowledge/social/url_index.yaml"
      template: "../knowledge/social/note_template.md"
      frontmatter_defaults:
        category: "social"
        priority: "medium"
        reviewed: false
    
    technology:
      description: "Technology-related knowledge"
      notes_directory: "../knowledge/technology/notes"
      context_file: "../knowledge/technology/context.md"
      url_index_file: "../knowledge/technology/url_index.yaml"
      template: "../knowledge/technology/note_template.md"
      frontmatter_defaults:
        category: "technology"
        priority: "medium"
        reviewed: false

    entertainment:
      description: "Entertainment-related knowledge"
      notes_directory: "../knowledge/entertainment/notes"
      context_file: "../knowledge/entertainment/context.md"
      url_index_file: "../knowledge/entertainment/url_index.yaml"
      template: "../knowledge/entertainment/note_template.md"
      frontmatter_defaults:
        category: "entertainment"
        priority: "medium"
        reviewed: false

# Workflow routing configuration
workflow:
  # Minimum answer confidence to display without suggesting web search
  answer_confidence_threshold: 0.7
  # Maximum source references to show the user
  max_sources_displayed: 10

# Metrics collection configuration
metrics:
  # Enable/disable metrics collection
  enabled: true
  # Directory to store metrics files
  directory: "metrics"

# OpenTelemetry tracing configuration
# Integrates with AI Toolkit Agent Inspector for trace viewing
tracing:
  # Enable/disable tracing (set to true, then open AI Toolkit trace viewer)
  enabled: true
  # OTLP gRPC endpoint (AI Toolkit default)
  otlp_endpoint: "http://localhost:4317"
  # Capture prompts and completions in traces (may contain sensitive data)
  enable_sensitive_data: true

# Progress indicator configuration
progress:
  # Enable progress indicators during long operations
  enabled: true
  # Style: spinner, dots, elapsed, message
  style: "dots"
  # Seconds between progress updates
  update_interval: 2.0
  # Show elapsed time in progress indicator
  show_elapsed: true
  # For streaming: seconds of idle before showing "still working" message
  streaming_idle_threshold: 5.0

# =============================================================================
# UI Preferences
# =============================================================================
ui:
  # Color theme: "dark" or "light"
  theme: "dark"
